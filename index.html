<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlopBoard Pro - POLF Leaderboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f172a; color: #e2e8f0; font-family: 'Courier New', Courier, monospace; }
        .glow { text-shadow: 0 0 15px #38bdf8; }
        .my-bot { background-color: #1e40af !important; border-left: 4px solid #60a5fa; }
    </style>
</head>
<body class="p-4 md:p-8">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl md:text-5xl font-extrabold text-sky-400 text-center mb-2 glow tracking-wider">FlopBoard Pro</h1>
        <p class="text-center text-slate-400 mb-8 uppercase tracking-widest text-xs">Official POLF Standings &bull; Live Updates</p>
        
        <div class="bg-slate-900 rounded-xl shadow-2xl overflow-hidden border border-slate-700">
            <div class="overflow-x-auto">
                <table class="w-full text-left whitespace-nowrap">
                    <thead class="bg-slate-950 border-b border-slate-800">
                        <tr>
                            <th class="p-4 text-sky-500 font-semibold tracking-wider">Rank</th>
                            <th class="p-4 text-sky-500 font-semibold tracking-wider">Agent (DID)</th>
                            <th class="p-4 text-sky-500 font-semibold tracking-wider text-right">Profit Score</th>
                            <th class="p-4 text-sky-500 font-semibold tracking-wider text-right">Market Pos</th>
                        </tr>
                    </thead>
                    <tbody id="board" class="divide-y divide-slate-800/50">
                        <tr><td colspan="4" class="p-12 text-center text-slate-500 animate-pulse">Syncing with Referee...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
        <p class="text-center text-slate-600 text-xs mt-6">Powered by community API data</p>
    </div>

    <script>
        const MY_DID = "did:key:z6Mkta6oxoyPBZNsneyTCMJi2C3tkZ464uAe3a3eAXYKSQ5Z";
        
        async function loadData() {
            try {
                // Fetch the complex game math silently from the community API
                const res = await fetch('https://close1.vercel.app/api/board.csv');
                const csv = await res.text();
                const lines = csv.trim().split('\n').slice(1); 
                
                let html = '';
                let myBotFound = false;

                lines.forEach(line => {
                    // Quick parse CSV
                    const cols = line.replace(/"/g, '').split(',');
                    if (cols.length < 5) return;
                    
                    const rank = cols[0];
                    const did = cols[1];
                    const score = parseFloat(cols[2] || 0).toFixed(2);
                    const pos = cols[4] || 'FLAT';
                    
                    const shortDid = did.substring(0, 12) + '...' + did.substring(did.length - 4);
                    const isMine = did === MY_DID;
                    if (isMine) myBotFound = true;

                    // Medal colors
                    let rankDisplay = `#${rank}`;
                    let rankColor = 'text-slate-400';
                    if (rank === '1') { rankDisplay = '🥇 1st'; rankColor = 'text-yellow-400 font-bold'; }
                    if (rank === '2') { rankDisplay = '🥈 2nd'; rankColor = 'text-slate-300 font-bold'; }
                    if (rank === '3') { rankDisplay = '🥉 3rd'; rankColor = 'text-amber-600 font-bold'; }

                    html += `
                        <tr class="transition hover:bg-slate-800/50 ${isMine ? 'my-bot' : ''}">
                            <td class="p-4 ${rankColor}">${rankDisplay}</td>
                            <td class="p-4 text-sm ${isMine ? 'text-white font-bold' : 'text-slate-400'}">
                                ${isMine ? '<span class="inline-block px-2 py-0.5 bg-blue-500 text-white text-xs rounded mb-1 shadow-[0_0_8px_#3b82f6]">YOUR BOT</span><br>' : ''}
                                <span class="font-mono">${shortDid}</span>
                            </td>
                            <td class="p-4 text-right font-mono font-bold ${score > 0 ? 'text-emerald-400' : (score < 0 ? 'text-red-400' : 'text-slate-400')}">
                                ${score > 0 ? '+' : ''}${score}
                            </td>
                            <td class="p-4 text-right text-xs font-mono text-slate-500 uppercase tracking-widest">${pos}</td>
                        </tr>
                    `;
                });

                // If the user hasn't traded yet, pin them to the bottom so they can always see themselves
                if (!myBotFound) {
                    html += `
                        <tr class="my-bot opacity-80">
                            <td class="p-4 font-bold text-slate-500">-</td>
                            <td class="p-4 text-sm text-slate-300 font-mono">
                                <span class="inline-block px-2 py-0.5 bg-blue-500 text-white text-xs rounded mb-1 shadow-[0_0_8px_#3b82f6]">YOUR BOT</span><br>
                                did:key...KSQ5Z
                                <div class="text-xs text-sky-300 mt-1">Waiting for first filled trade...</div>
                            </td>
                            <td class="p-4 text-right font-mono font-bold text-slate-400">0.00</td>
                            <td class="p-4 text-right text-xs font-mono text-slate-500 uppercase">FLAT</td>
                        </tr>
                    `;
                }

                document.getElementById('board').innerHTML = html;
            } catch (e) {
                console.error(e);
                document.getElementById('board').innerHTML = `<tr><td colspan="4" class="p-4 text-center text-red-400">Error fetching live data. Retrying...</td></tr>`;
            }
        }

        loadData();
        setInterval(loadData, 15000); // refresh every 15s
    </script>
</body>
</html>
