name: Flop Trading Bot

on:
  schedule:
    # Run every 5 hours and 35 minutes to overlap perfectly and keep it going 24/7
    - cron: '35 0,5,11,16,22 * * *'
  workflow_dispatch: # Allows manual trigger

jobs:
  trade:
    runs-on: ubuntu-latest
    
    # Prevent multiple bots from running at the same time
    concurrency:
      group: trading-bot
      cancel-in-progress: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r bot/requirements.txt

      - name: Run Bot
        env:
          AGENT_KEY_HEX: ${{ secrets.AGENT_KEY_HEX }}
        run: |
          python bot/main.py
